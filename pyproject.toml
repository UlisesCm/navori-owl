[project]
name = "navori-owl"
version = "0.0.1"
description = "Reproducible benchmark for coding agents and harnesses, built on Harbor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.23.0",
    "pyyaml>=6",
]

[project.scripts]
owl = "owl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["owl"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

id: superpowers
description: obra/superpowers cargado como plugin de sesión (--plugin-dir).
agent: claude-code
agent_version: "2.1.312"
harness:
  version: "v7.0.1@2ce8aa15"   # round-protocol R2
  upstream: github-release:obra/superpowers
  plugins:
    - name: superpowers
      git: https://github.com/obra/superpowers
      ref: 2ce8aa15d05bd57213e6f746f953aafb7ded7a8b   # v7.0.1, 2026-10-21
  # source: superpowers v7.0.1 skills/writing-plans/SKILL.md:16 (plans) and
  # skills/brainstorming/SKILL.md:225 (specs) write under docs/superpowers/plans/ and
  # docs/superpowers/specs/ (narrowed in T14, re-audited at the r1 cutoff).
  artifacts:
    - "docs/superpowers/specs/"
    - "docs/superpowers/plans/"
  # source: superpowers v7.0.1 scripts write .superpowers/sdd/<plan-basename>/ and
  # .superpowers/brainstorm/ (skills/subagent-driven-development/scripts/sdd-workspace:49,
  # task-brief:7, review-package:8; skills/brainstorming/scripts/start-server.sh:117-121):
  # plugin-written state, not agent output (T14, re-audited at the r1 cutoff).
  runtime_state:
    - ".superpowers/"
  env:
    SUPERPOWERS_DISABLE_TELEMETRY: "1"
expect:
  plugins: [superpowers]
  mcp_servers: []

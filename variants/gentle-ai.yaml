# gentle-ai v4.3.1 installed by its own binary, pinned by release and sha256, with the product defaults.
#
# DISCLOSURE (RULES.md / report, D17):
# - Route: release tarball from github.com/Gentleman-Programming/gentle-ai (v4.3.1), verified with a
#   sha256 pinned in this file (taken from the release's checksums.txt, spike §"v4.3.1") and extracted
#   to $HOME/.local/bin (Harbor puts it on PATH). The minisign signature is not verified (it would
#   need `minisign` in the image).
# - Command, from /app: `gentle-ai install --agent claude-code --preset full-gentleman --scope
#   workspace`. No --persona: product defaults, i.e. persona `gentleman` and receipt-driven
#   development `on` (spike §"v4.3.1"); v4 retired SDD/openspec in favor of ODD. The `gentleman`
#   persona tells the agent to use bat/rg/fd/sd/eza, which the image does not have; it is measured
#   as shipped.
# - Telemetry: OFF. `GENTLE_AI_TELEMETRY=0` is exported in `init` (install-time telemetry) and set in
#   `harness.env` (the Stop/SubagentStop hooks would otherwise report model and tokens each session).
#   Evidence: the spike saw status `disabled (source: GENTLE_AI_TELEMETRY)` and hooks answering
#   "disabled"; the T21 smoke (specs/f3-ronda1/smoke.md) only shows GENTLE_AI_TELEMETRY=0 in the
#   agent env and the telemetry Stop hook running with no output or errors. That nothing is reported
#   is inferred from the env var, not observed on the wire.
# - Where it writes (spike T11 §4-§5): the project side (/app/.claude/**, /app/.mcp.json with context7)
#   stays as installed. State and tools in $HOME (~/.gentle-ai, ~/.config/gga, ~/.local/share/gga,
#   ~/.engram, ~/.local/bin/{gga,engram}) stay in $HOME. Themes (~/.claude/themes) are not bridged.
#   Only the `permissions.deny` rules that gentle-ai writes to ~/.claude/settings.json are bridged
#   (bridge B) into $OWL_CLAUDE_CONFIG_DIR/settings.json, because Harbor runs Claude Code with
#   CLAUDE_CONFIG_DIR=/logs/agent/sessions and would not load ~/.claude*.
# - engram: NOT pinned. The installer downloads engram from `releases/latest` (3.6.0 observed at
#   the r1 cutoff, 2026-10-28) unless one is already in PATH. The version can change between
#   rounds; report the version seen in the trial.
# - TO CONFIRM IN T21 (the spike had no real `claude`, only a stub): what `claude plugin install
#   engram` and `claude mcp add --scope user engram` write, and whether that lands under
#   CLAUDE_CONFIG_DIR (exported below to $OWL_CLAUDE_CONFIG_DIR). If it lands in ~/.claude* the
#   bridge must also cover ~/.claude.json mcpServers and ~/.claude/plugins/. The `expect` block below
#   is likewise provisional: .mcp.json only declares context7; whether engram appears as a loaded
#   MCP server or plugin in `system/init` is confirmed in T21.
# - TO CONFIRM IN T21: the real Harbor mount of /logs/agent (the spike emulated it), and the
#   review stop-hook's effect on headless sessions (D3, "Riesgo declarado").
id: gentle-ai
description: gentle-ai v4.3.1 instalado desde su release pineado (claude-code, preset full-gentleman, scope workspace) con telemetría apagada.
agent: claude-code
agent_version: "2.1.312"
harness:
  version: "v4.3.1"   # round-protocol R2
  upstream: github-release:Gentleman-Programming/gentle-ai
  init: |
    set -eu
    GENTLE_AI_VERSION="4.3.1"
    case "$(uname -m)" in
      x86_64)
        GENTLE_AI_ARCH=amd64
        GENTLE_AI_SHA256="04ec685c56b42c29dff6db10fc7dc2c730217dc9c96736e53ad2acf3226dafb7" ;;
      aarch64|arm64)
        GENTLE_AI_ARCH=arm64
        GENTLE_AI_SHA256="99e7d313a2ff85eaf23a6415e9b3aae67bf74c2fa169b21b93070ada7613f6a0" ;;
      *) echo "gentle-ai: unsupported arch $(uname -m)" >&2; exit 1 ;;
    esac
    GENTLE_AI_TARBALL="gentle-ai_${GENTLE_AI_VERSION}_linux_${GENTLE_AI_ARCH}.tar.gz"
    GENTLE_AI_URL="https://github.com/Gentleman-Programming/gentle-ai/releases/download/v${GENTLE_AI_VERSION}/${GENTLE_AI_TARBALL}"
    GENTLE_AI_TMP="$(mktemp -d)"
    curl -fsSL -o "$GENTLE_AI_TMP/$GENTLE_AI_TARBALL" "$GENTLE_AI_URL"
    echo "$GENTLE_AI_SHA256  $GENTLE_AI_TARBALL" > "$GENTLE_AI_TMP/checksum.txt"
    (cd "$GENTLE_AI_TMP" && sha256sum -c checksum.txt)
    mkdir -p "$HOME/.local/bin"
    tar -xzf "$GENTLE_AI_TMP/$GENTLE_AI_TARBALL" -C "$GENTLE_AI_TMP" gentle-ai
    install -m 0755 "$GENTLE_AI_TMP/gentle-ai" "$HOME/.local/bin/gentle-ai"
    rm -rf -- "$GENTLE_AI_TMP"
    export PATH="$HOME/.local/bin:$PATH"
    export GENTLE_AI_TELEMETRY=0
    # Claude Code config the installer writes through `claude` lands in the trial's config dir.
    : "${OWL_CLAUDE_CONFIG_DIR:?OWL_CLAUDE_CONFIG_DIR is not set}"
    mkdir -p "$OWL_CLAUDE_CONFIG_DIR"
    export CLAUDE_CONFIG_DIR="$OWL_CLAUDE_CONFIG_DIR"
    cd /app
    gentle-ai install --agent claude-code --preset full-gentleman --scope workspace
    # Bridge B (spike T11 §5): merge the permissions.deny rules gentle-ai writes to
    # ~/.claude/settings.json into the trial's settings.json.
    if [ -f "$HOME/.claude/settings.json" ]; then
      node -e '
        const fs = require("fs");
        const [src, dst] = process.argv.slice(1);
        const read = (p) => (fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, "utf8")) : {});
        const s = read(src), d = read(dst);
        const deny = [...new Set([...(d.permissions?.deny ?? []), ...(s.permissions?.deny ?? [])])];
        d.permissions = { ...(d.permissions ?? {}), deny };
        fs.writeFileSync(dst, JSON.stringify(d, null, 2) + "\n");
      ' "$HOME/.claude/settings.json" "$OWL_CLAUDE_CONFIG_DIR/settings.json"
    fi
    # Sentinel (D3): fail the setup loudly (exit 1) if the installed harness is not what the
    # spike observed, instead of running the trial without it.
    grep -q '"context7"' /app/.mcp.json || { echo "gentle-ai: context7 missing from .mcp.json" >&2; exit 1; }
    grep -q 'gentle-ai review stop-hook' /app/.claude/settings.json || { echo "gentle-ai: review stop-hook missing from .claude/settings.json" >&2; exit 1; }
    test -f /app/.claude/CLAUDE.md || { echo "gentle-ai: .claude/CLAUDE.md missing" >&2; exit 1; }
    test -d /app/.claude/agents || { echo "gentle-ai: .claude/agents missing" >&2; exit 1; }
    test -d /app/.claude/skills || { echo "gentle-ai: .claude/skills missing" >&2; exit 1; }
    grep -q '"deny"' "$OWL_CLAUDE_CONFIG_DIR/settings.json" || { echo "gentle-ai: deny rules not bridged to $OWL_CLAUDE_CONFIG_DIR" >&2; exit 1; }
    grep -q 'opsdesk-conventions-sentinel-f96c2e' /app/CLAUDE.md || { echo "gentle-ai: base CLAUDE.md content missing after install" >&2; exit 1; }
    grep -q 'opsdesk-conventions-sentinel-f96c2e' /app/AGENTS.md || { echo "gentle-ai: base AGENTS.md content missing after install" >&2; exit 1; }
  env:
    GENTLE_AI_TELEMETRY: "0"
  # source: gentle-ai v4.3.1 installed .claude/CLAUDE.md:487,547 and
  # .claude/skills/_shared/persistence-contract.md:5 order `odd/tasks/<feature-name>.md` before
  # the first source write; `odd/<feature-name>/tasks` is an Engram topic, not a path. v4 retired
  # SDD: no installed asset mentions openspec/ (r1 cutoff audit).
  artifacts:
    - "odd/tasks/"
  # .atl/ is written by the harness itself (UserPromptSubmit hook `skill-registry refresh`), not
  # agent output (spike T11 §4, §12; same in v4.3.1, the only /app write of its session hooks).
  # Review authority state lives under /app/.git/gentle-ai/, outside the scope snapshot.
  runtime_state:
    - ".atl/"
# source: T21 smoke: the engram component of preset full-gentleman runs `claude plugin install`
# (plugin engram) and `claude mcp add --scope user` (server engram); .mcp.json adds context7.
expect:
  plugins: [engram]
  mcp_servers: [context7, engram]
